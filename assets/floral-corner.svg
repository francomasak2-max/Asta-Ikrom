<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520">
<defs>
 <radialGradient id="w" cx=".5" cy=".42"><stop offset="0" stop-color="#fff"/><stop offset=".72" stop-color="#f7fdff"/><stop offset="1" stop-color="#dceff5"/></radialGradient>
