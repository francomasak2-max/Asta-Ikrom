 <linearGradient id="l" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bdeaf2"/><stop offset=".55" stop-color="#5ca9b8"/><stop offset="1" stop-color="#1f6578"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#28798c" flood-opacity=".18"/></filter>
</defs>
<g fill="none" stroke="url(#l)" stroke-width="5" stroke-linecap="round" opacity=".85">
